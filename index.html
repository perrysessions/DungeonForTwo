<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dungeon For Two</title>
  <meta name="description" content="A local 2-player browser roguelike. Fight through 20 dungeon floors, level up your class, and take on epic bosses. Free to play!" />
  <meta property="og:title" content="Dungeon For Two" />
  <meta property="og:description" content="A local 2-player browser roguelike. Fight through 20 dungeon floors, level up your class, and take on epic bosses." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/preview.png" />
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DungeonForTwo" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loading-screen">
    <div id="loading-content">
      <div id="loading-title">⚔ Dungeon For Two ⚔</div>
      <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
      <div id="loading-text">Loading…</div>
    </div>
  </div>
  <div id="rotate-msg">⟳ Rotate your device to play</div>
  <div id="game-root">
    <aside id="panel-left" class="panel"></aside>
    <main id="stage">
      <canvas id="canvas" width="768" height="576"></canvas>
      <div id="overlay" class="hidden"></div>
      <button id="mute-btn" title="Mute/Unmute (M)">🔊</button>
      <button id="settings-btn" title="Settings (Esc)">⚙</button>
      <div id="settings-modal" class="hidden">
        <div id="settings-panel">
          <h2>Settings</h2>
          <div class="setting-row">
            <label>Music Volume</label>
            <input type="range" id="vol-music" min="0" max="100" value="25">
            <span id="vol-music-val">25%</span>
          </div>
          <div class="setting-row">
            <label>SFX Volume</label>
            <input type="range" id="vol-sfx" min="0" max="100" value="70">
            <span id="vol-sfx-val">70%</span>
          </div>
          <hr>
          <div id="restart-area">
            <button id="restart-btn">Restart Run</button>
            <div id="restart-confirm" class="hidden">
              <p>Abandon this run and start over?</p>
              <button id="restart-yes">Yes, restart</button>
              <button id="restart-no">Cancel</button>
            </div>
          </div>
          <button id="settings-close">Close</button>
          <div id="hs-view-panel">
            <hr>
            <p style="font-size:12px;color:#aaa;margin:4px 0 6px;text-align:center">— Hall of Records —</p>
            <div id="hs-view-table"></div>
          </div>
        </div>
      </div>
    </main>
    <aside id="panel-right" class="panel"></aside>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
